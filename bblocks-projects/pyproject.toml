[project]
name = "bblocks-projects"
version = "1.0.3"
description = "ONE Data Python project utilities - templates, tools, and workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ONE Data", email = "data@one.org" }
]
keywords = ["bblocks", "template", "copier", "python", "cli", "project-generator", "utilities"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "copier>=9.17.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tomlkit>=0.15.0",
    "typer>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/ONEcampaign/bblocks-projects"
Repository = "https://github.com/ONEcampaign/bblocks-projects"
Issues = "https://github.com/ONEcampaign/bblocks-projects/issues"

[project.scripts]
bblocks-projects = "bblocks.projects.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.0",
    "ty>=0.0.59",
    "mkdocs-material>=9.7.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bblocks.projects"
namespace = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # bugbear
    "C4",             # comprehensions
    "SIM",            # simplify
    "PL",             # pylint
    "RUF",            # ruff-specific
    "ERA",            # eradicate (commented-out code)
    "PERF",           # perflint
    "ANN",            # flake8-annotations (require type hints on public APIs)
]
ignore = [
    "E501",      # Line length (formatter handles)
    "B008",      # Function call in argument defaults (standard for Typer CLI)
    "PLR0913",   # Too many arguments
    "PLR0912",   # Too many branches
    "PLR0914",   # Too many locals
    "PLR0915",   # Too many statements
    "PLR2004",   # Magic values
    "ANN401",    # Allow `Any` in typed signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "PLR2004"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src"]
