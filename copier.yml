_min_copier_version: "9.0.0"
_subdirectory: template

# Metadata
project_name:
  type: str
  help: What is your project name? (e.g., "My Awesome Project")

project_slug:
  type: str
  help: Python-compatible project name (e.g., "my_awesome_project")
  default: "{{ project_name|lower|replace(' ', '_')|replace('-', '_') }}"
  validator: >-
    {%- if not (project_slug | regex_search('^[a-zA-Z][a-zA-Z0-9_]*$')) -%}
    project_slug must be a valid Python identifier
    (letters, digits, and underscores only; must start with a letter)
    {%- endif -%}

project_description:
  type: str
  help: Brief project description

# Project type - drives structure
project_type:
  type: str
  help: What type of project?
  choices:
    Package (library published to PyPI): package
    Project (analysis, pipelines, internal tools): project
    # `research` is a legacy alias for `project`. Kept here so existing
    # projects with `project_type: research` in .copier-answers.yml still
    # validate during `copier update`. Template conditionals are inverted
    # to `!= 'package'`, so both values render the same layout.
    "Research (legacy alias for Project — kept for backwards compatibility)": research
  default: project

# Family contract — see docs/the-family-contract.md
preset:
  type: str
  help: >-
    Which conventions apply? `family` opts into the bblocks family contract:
    a Python 3.12 floor, readerkit for HTTP and caching, no upper-bound pins,
    OIDC publishing, branch protection, and a conda-forge feedstock. Enforced
    by `bblocks-projects doctor --strict`. `standalone` is the ordinary preset.
  choices:
    Standalone (ordinary project or package): standalone
    Family (bblocks family package, enforced by doctor): family
  default: standalone

include_notebooks:
  type: bool
  help: Include a notebooks/ directory for Jupyter exploration?
  default: false
  when: "{{ project_type != 'package' }}"

include_pytest:
  type: bool
  help: Include pytest with coverage (config, dev deps, tests/ directory, CI test job)?
  default: false
  when: "{{ project_type != 'package' }}"

# Author info
author_name:
  type: str
  help: Author name
  default: ""

author_email:
  type: str
  help: Author email
  default: ""

# Python version
python_version:
  type: str
  help: Minimum Python version
  default: "{{ '3.12' if preset == 'family' else '3.13' }}"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"
  validator: >-
    {%- if preset == 'family' and python_version == '3.11' -%}
    The family preset requires a Python floor of 3.12 or higher.
    Choose 3.12 or later, or answer `standalone` to the preset question.
    {%- endif -%}

# License
license:
  type: str
  help: License
  choices:
    MIT: mit
    Apache-2.0: apache
    BSD-3-Clause: bsd3
    None: none
  default: mit

# GitHub settings (for CI/CD)
github_username:
  type: str
  help: >-
    GitHub username or organisation used in CI/CD workflow files and PyPI trusted
    publishing configuration. Override at CLI with: --data github_username=yourname
  when: "{{ project_type == 'package' }}"

# Post-generation messages
_message_after_copy: |
  🎉 Project "{{ project_name }}" created successfully!

  Next steps:

  1. Change directory to the project root:

     $ cd {{ _copier_conf.dst_path }}

  2. Review and edit README.md with project-specific information

  {% if project_type == 'package' -%}
  3. Run tests to verify everything works:

     $ uv run pytest

  4. Build your package:

     $ uv build

  5. When ready to publish:
     - Set up PyPI trusted publishing: https://docs.pypi.org/trusted-publishers/
     - Create a git tag: git tag v0.1.0
     - Push the tag: git push origin v0.1.0
  {%- else -%}
  3. Install the project (creates an editable src/{{ project_slug }} package):

     $ uv sync

  4. Add your reusable analysis code under src/{{ project_slug }}/

  5. Add raw data to data/raw/ (gitignored — never commit source data)

  6. Write processed/derived data to data/processed/ (tracked in git)
  {% if include_notebooks %}
  7. Add Jupyter notebooks under notebooks/ for exploration

  8. Run quality checks:

     $ uv run ruff check .
     $ uv run ty check src/{{ project_slug }}
  {% if include_pytest %}
  9. Run tests:

     $ uv run pytest
  {% else %}
  9. Optional: add pytest later with:

     $ bblocks-projects add pytest
  {% endif %}
  {% else %}
  7. Run quality checks:

     $ uv run ruff check .
     $ uv run ty check src/{{ project_slug }}
  {% if include_pytest %}
  8. Run tests:

     $ uv run pytest
  {% else %}
  8. Optional: add pytest later with:

     $ bblocks-projects add pytest
  {% endif %}
  {% endif %}
  {%- endif %}

_message_after_update: |
  ✨ Project "{{ project_name }}" updated successfully!

  The template has been updated. Please review the changes:

  1. Check for conflicts in modified files
  2. Review .copier-answers.yml for updated template settings
  3. Refresh the lockfile and environment: uv sync
  4. Run tests to ensure everything still works{% if project_type == 'package' %}: uv run pytest{% endif %}
  5. If .pre-commit-config.yaml changed, reinstall the hooks: uv run pre-commit install
  6. Commit the changes when ready

  To see what changed:
     $ git diff

  Need help resolving conflicts? Check the Copier docs:
  https://copier.readthedocs.io/en/stable/updating/

# Post-generation tasks
#
# None of these run on `copier update` — every one is guarded to `copy`
# only, deliberately, because `copier update` runs `_tasks` *before* it
# replays the diff that restores local edits (see _apply_update() in
# copier's _main.py). A task that fails on a second run — and network
# calls, dependency resolution, and git operations against an
# already-initialized repo can all fail on a second run — aborts the
# update mid-flight, after the working tree has already been overwritten
# with fresh template scaffold but before copier ever reapplies the
# subproject's real content, silently destroying source and tests. That
# failure is strictly worse than a task simply not running, so no task
# runs on update at all; `_message_after_update` above tells the user which
# of these to run by hand instead.
#
# `_copier_operation` is "update" for every nested render `copier update`
# performs internally, not just the real destination — including the
# throwaway "old" and "new" template renders it diffs against each other.
# Copier only makes those throwaway renders into git repos *after* `_tasks`
# has run, which is a second, independent reason every task here has to be
# guarded: `uv run pre-commit install`, guarded for the reason above, would
# otherwise still fail inside those renders once `git init` is skipped
# there.
_tasks:
  - command: "git init"
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv venv" # fails outright if .venv already exists (update always has one)
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv sync" # needs the network and dependency resolution; either can fail
    when: "{{ _copier_operation == 'copy' }}"
  - command: "git add ." # Includes uv.lock for version control
    when: "{{ _copier_operation == 'copy' }}"
  - command: 'git commit -m "Initial commit from copier template"'
    when: "{{ _copier_operation == 'copy' }}"
  - command: "uv run pre-commit install" # needs the git repo that only `copy` guarantees
    when: "{{ _copier_operation == 'copy' }}"
