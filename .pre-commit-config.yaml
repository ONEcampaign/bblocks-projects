repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd bblocks-projects && uv run ruff check --fix'
        language: system
        types: [python]
        files: ^bblocks-projects/
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd bblocks-projects && uv run ruff format'
        language: system
        types: [python]
        files: ^bblocks-projects/
        pass_filenames: false
      - id: ty
        name: ty
        entry: bash -c 'cd bblocks-projects && uv run ty check'
        language: system
        types: [python]
        files: ^bblocks-projects/
        pass_filenames: false
